<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Quarto</title>
    <link rel="stylesheet" href="./style/styles.css">
</head>
<body>
    <div class="reservation-container">
        <h2>Reserva de Quarto</h2>
        <form action="/reservation" method="post" id="reservationForm">
            <div class="form-group">
                <label for="date">Data da Reserva</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Escolha o Quarto:</label>
                <div class="rooms">
                    <div class="room" data-id="101">Quarto 101</div>
                    <div class="room" data-id="102">Quarto 102</div>
                    <div class="room" data-id="103">Quarto 103</div>
                    <div class="room" data-id="104">Quarto 104</div>
                </div>
            </div>
            <input type="hidden" name="room_id" id="room_id">
            <div class="form-submit">
                <button type="submit">Reservar</button>
            </div>
        </form>
    </div>

    <script src="javascript.js"></script>

</body>
</html>
